<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <!-- 浏览器兼容性和渲染模式 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="renderer" content="webkit" />

    <!-- 响应式和移动优化 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- SEO 和描述信息 -->
    <meta name="description" content="矿山全生命周期展示平台 - 探索矿山开采的全流程管理，包括前期准备、露天开采、地下开采、辅助生产和安全红线等各个阶段。" />
    <meta name="keywords" content="矿山, 开采, 全生命周期, 安全, 绿色矿山, 智慧矿山" />
    <meta name="author" content="矿山展示平台团队" />

    <!-- Open Graph / 社交媒体优化 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="矿山全生命周期展示平台" />
    <meta property="og:description" content="探索矿山开采的全流程管理，从地质勘探到安全红线监控的完整生命周期。" />
    <meta property="og:image" content="/og-image.png" />

    <!-- 图标 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>" />

    <!-- 主题颜色 -->
    <meta name="theme-color" content="#00bcd4" />
    <meta name="msapplication-TileColor" content="#00bcd4" />

    <!-- 预连接和性能优化 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 页面标题 -->
    <title>矿山全生命周期展示平台 - 绿色矿山建设</title>

    <!-- 可选: 添加结构化数据 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "矿山全生命周期展示平台",
      "description": "探索矿山开采的全流程管理，包括前期准备、露天开采、地下开采、辅助生产和安全红线等各个阶段。",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web"
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
