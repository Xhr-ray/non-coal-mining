# 矿山全生命周期展示平台 - Nginx 部署配置
# 服务器: 腾讯云 CVM (124.222.159.9) / 域名: miningprocess.online

server {
    listen 80;
    server_name miningprocess.online www.miningprocess.online;

    # 站点根目录
    root /var/www/mining;
    index index.html;

    # 日志
    access_log /var/log/nginx/mining-access.log;
    error_log  /var/log/nginx/mining-error.log;

    # SPA 路由回退：所有非文件请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 图片资源缓存
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
